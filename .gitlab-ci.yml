# CI 構成。
#
# lint / test は「実際に動作確認した PHP バージョン」で回す（README の
# 動作確認環境に合わせて 8.2）。当初 php:7.4-cli を指定していたが、
# composer.lock は PHP 8 系で生成されており開発依存（doctrine/instantiator 2.0 等）が
# PHP 8.1 以上を要求するため `composer install` が解決できず失敗した。
#
# 一方 composer.json の require は php >=7.4 としている。この下限を裏付けるため、
# 開発依存を必要としない構文チェック（php -l）だけを 7.4 でも実行する。
# 「7.4 でテストが全て通ることを確認した」とまでは言えないため、
# 構文互換の確認に留めていることをジョブ名で明示している。

stages:
  - lint
  - test

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"

.php82:
  image: php:8.2-cli
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq git unzip libzip-dev
    - docker-php-ext-install zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --prefer-dist
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/

lint:
  extends: .php82
  stage: lint
  script:
    - composer lint

# 検証環境（docker/ 配下の動作確認用テーマとセットアップスクリプト）の規約チェック。
# 提出物ではないが、リポジトリに含まれるコードなので同じ基準で検証する。
# プラグイン本体とは別のルールセットにしているのは、Welcart 本体が
# ファイル名・変数名をハードコードで探す箇所があり、テーマ側では
# 一部の命名規則スニフを除外する必要があるため（docker/phpcs.xml.dist のコメント参照）。
lint:env:
  extends: .php82
  stage: lint
  script:
    - composer lint:env

test:
  extends: .php82
  stage: test
  script:
    - composer test

# composer.json の "php": ">=7.4" の下限を裏付ける構文互換チェック。
# 開発依存を入れないため composer install は行わない。
syntax:php7.4:
  image: php:7.4-cli
  stage: lint
  before_script: []
  script:
    - php -v
    - find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
